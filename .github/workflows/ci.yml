name: CI

# Every pull request and every push to main is linted, type-checked and built.
# Pushes to main (and manual runs) are then uploaded to the web host over FTP.
#
# Repository secrets used by the deploy job:
#   FTP_HOST      server name, e.g. ftp.example.org
#   FTP_USERNAME  FTP account
#   FTP_PASSWORD  its password
#   FTP_PATH      folder on the server that the site is served from, e.g. /public_html/
#
# Optional repository variables:
#   FTP_PROTOCOL     ftps (default) or ftp
#   FTP_PORT         defaults to 21
#   FTP_VERIFY_CERT  the server's TLS certificate is checked unless this is false

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Keep the built site for the deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over FTP
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The first upload sends every file (about 120 MB) and is slow.
    # Later runs only send what changed.
    timeout-minutes: 90
    # One deploy at a time; a newer push waits for the running upload to finish.
    concurrency:
      group: ftp-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      # Uploads new and changed files, removes deleted ones, retries on
      # network errors. See the script for details.
      - name: Upload to the web host
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'true' }}
        run: python3 .github/scripts/deploy_ftp.py out
